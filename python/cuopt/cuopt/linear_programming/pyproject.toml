[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.

[project]
name = "rocopt_mps_parser"
dynamic = ["version"]
description = "cuOpt - GPU Combinatorial Optimization"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5,<3.0",
    "rapids-logger==0.2.*,>=0.0.0a0",
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
# TODO(rocopt-docs): set Homepage to the rocOpt documentation URL when published
Source = "https://github.com/AMD-AIOSS/rocopt"

[project.optional-dependencies]
test = [
    "pytest-cov",
    "pytest<9.0",
    "rapids-logger==0.2.*,>=0.0.0a0",
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages=["data_model", "cuopt_mps_parser"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuopt_mps_parser/VERSION"
regex = "(?P<value>.*)"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

build-backend = "scikit_build_core.build"
dependencies-file = "../../../../dependencies.yaml"
commit-files = [
    "cuopt_mps_parser/GIT_COMMIT"
]
disable-cuda = true
requires = [
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
    "rapids-logger==0.2.*,>=0.0.0a0",
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.
