[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cmake>=3.30.4",
    "cython>=3.0.3",
    "ninja",
    "numpy>=1.23.5,<3.0",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.

[project]
name = "rocopt"
dynamic = ["version"]
description = "rocOpt - GPU Combinatorial Optimization (ROCm-DS port)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # ROCm-DS equivalents of CUDA dependencies
    "numba>=0.60.0",
    "numpy>=1.23.5,<3.0",
    "pandas>=2.0",
    "pyyaml>=6.0.0",
] # Modified for ROCm-DS: removed cuda-python, cudf, cupy-cuda13x, numba-cuda,
  # pylibraft, rmm (installed separately via AMD PyPI).
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "numpy>=1.23.5,<3.0",
    "pytest-cov",
    "pytest<9.0",
]

[project.urls]
# TODO(rocopt-docs): set Homepage to the rocOpt documentation URL when published
Source = "https://github.com/AMD-AIOSS/rocopt"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "cuopt",
]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# detect when package size grows significantly
max_allowed_size_compressed = '100M'

[tool.pytest.ini_options]
testpaths = ["cuopt/tests"]
import_mode = "importlib"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["cuopt"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuopt/VERSION"
regex = "(?P<value>.*)"
