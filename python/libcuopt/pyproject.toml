[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cmake>=3.30.4",
    "ninja",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.

[project]
name = "librocopt"
dynamic = ["version"]
description = "cuOpt - GPU Optimizer (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rocopt-mps-parser==1.0.*,>=0.0.0a0",
    "librmm==26.4.*,>=0.0.0a0",
    "nvidia-cublas",
    "nvidia-cudart",
    "nvidia-cudss",
    "nvidia-curand",
    "nvidia-cusolver",
    "nvidia-cusparse",
    "nvidia-nvtx",
    "rapids-logger==0.2.*,>=0.0.0a0",
    "cmake>=3.30.4",
    "ninja",
] # Modified for ROCm-DS: bypass rapids-build-backend, use scikit-build-core directly.

[project.urls]
# TODO(rocopt-docs): set Homepage to the rocOpt documentation URL when published
Source = "https://github.com/AMD-AIOSS/rocopt"

[project.entry-points."cmake.prefix"]
libcuopt = "libcuopt"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]
max_allowed_size_compressed = '620M'

[project.scripts]
cuopt_cli = "libcuopt._cli_wrapper:main"


[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["libcuopt"]
wheel.install-dir = "libcuopt"
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuopt/VERSION"
regex = "(?P<value>.*)"
