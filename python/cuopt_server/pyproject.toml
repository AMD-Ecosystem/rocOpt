[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0.0",
    "wheel",
] # Modified for ROCm-DS: bypass rapids-build-backend, use setuptools directly.

[project]
name = "rocopt_server"
dynamic = ["version"]
description = "cuOpt Microserver - GPU Combinatorial Optimization"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cuopt==1.0.*,>=0.0.0a0",
    "fastapi",
    "jsonref==1.1.0",
    "msgpack-numpy==0.4.8",
    "msgpack==1.1.0",
    "numpy>=1.23.5,<3.0",
    "pandas>=2.0",
    "psutil>=6.0.0",
    "uvicorn==0.34.*",
] # Modified for ROCm-DS: removed cupy-cuda13x (provided by amd-cupy via amd-hipdf).
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "jsonref==1.1.0",
    "msgpack-numpy==0.4.8",
    "msgpack==1.1.0",
    "pexpect",
    "pytest-cov",
    "pytest<9.0",
    "requests",
] # Modified for ROCm-DS: bypass rapids-build-backend, use setuptools directly.

[project.urls]
# TODO(rocopt-docs): set Homepage to the rocOpt documentation URL when published
Source = "https://github.com/AMD-AIOSS/rocopt"

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
version = {file = "cuopt_server/VERSION"}

[tool.setuptools.packages.find]
include = [
    "cuopt_server*",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "cuopt_server",
]

[tool.ruff.lint.isort.sections]
rapids = [
    "cudf",
    "pylibraft",
    "rmm",
    "cuopt",
]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

[tool.pytest.ini_options]
testpaths = ["cuopt_server/tests"]

build-backend = "setuptools.build_meta"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true"
